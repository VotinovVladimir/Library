<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Библиотека{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="header-inner">

        <div class="brand">
            <div class="brand-icon">📚</div>

            <div>
                <h1>Библиотека</h1>
                <p>Информационная система управления библиотекой</p>
            </div>
        </div>

        <nav>
            <a href="{{ url_for('index') }}"
               class="{{ 'active' if request.endpoint == 'index' else '' }}">
                Главная
            </a>

            <a href="{{ url_for('books') }}"
               class="{{ 'active' if request.endpoint in ['books', 'add_book', 'edit_book'] else '' }}">
                Каталог книг
            </a>

            <a href="{{ url_for('readers') }}"
               class="{{ 'active' if request.endpoint in ['readers', 'add_reader', 'edit_reader'] else '' }}">
                Читатели
            </a>

            <a href="{{ url_for('loans') }}"
               class="{{ 'active' if request.endpoint in ['loans', 'add_loan'] else '' }}">
                Выдачи
            </a>

            <a href="{{ url_for('statistics') }}"
               class="{{ 'active' if request.endpoint == 'statistics' else '' }}">
                Статистика
            </a>
        </nav>

    </div>
</header>

<main>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="message {{ category }}">
        {{ message }}
    </div>
    {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

</body>
</html>
